<script>
(function () {
  var L = JSON.parse(document.getElementById('locked').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), err = document.getElementById('err'),
      rem = document.getElementById('remember');
  var KEY = 'mappa-heslo';
  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

  async function decrypt(password) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(L.salt), iterations: L.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(L.iv) }, key, b64(L.data));
    return new TextDecoder().decode(plain);
  }

  async function open(password, persist) {
    go.disabled = true; go.textContent = 'Otevírám…'; err.classList.remove('on');
    try {
      var html = await decrypt(password);
      try { sessionStorage.setItem(KEY, password); if (persist) localStorage.setItem(KEY, password); } catch (e) {}
      document.open(); document.write(html); document.close();
    } catch (e) {
      go.disabled = false; go.textContent = 'Otevřít';
      err.classList.add('on'); pw.select();
      try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e2) {}
    }
  }

  f.addEventListener('submit', function (e) { e.preventDefault(); if (pw.value) open(pw.value, rem.checked); });

  // už odemčeno v této záložce / na tomto zařízení → rovnou otevřít
  var saved = null;
  try { saved = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) {}
  if (saved) open(saved, false);
})();
</script>
