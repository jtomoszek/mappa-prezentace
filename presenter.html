<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poznámky řečníka — MAPPA</title>
<style>
  @font-face { font-family:'Lufga'; font-weight:400; font-display:swap; src:url("https://db.onlinewebfonts.com/t/9df35b2045f6e32dcfa5bbc421ed05b1.woff2") format("woff2"); }
  @font-face { font-family:'Lufga'; font-weight:500; font-display:swap; src:url("https://db.onlinewebfonts.com/t/4608c4cbcc9dd6b120db766a634c3d60.woff2") format("woff2"); }
  @font-face { font-family:'Lufga'; font-weight:600; font-display:swap; src:url("https://db.onlinewebfonts.com/t/1e053b4805d075f403dd3e44a3d4ec31.woff2") format("woff2"); }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#101010; color:#FAFAF9; height:100vh; overflow:hidden;
    font-family:'Lufga','Hanken Grotesk',system-ui,sans-serif;
    display:grid; grid-template-rows:auto 1fr auto; gap:16px; padding:16px;
  }
  header{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .clock{ font-size:34px; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .clock small{ display:block; font-size:11px; color:#8F8F8A; font-weight:400; letter-spacing:0; }
  .count{ font-size:14px; color:#8F8F8A; font-variant-numeric:tabular-nums; }
  .count b{ color:#EDF725; font-size:20px; }
  .label{ font-size:12px; color:#8F8F8A; margin-bottom:6px; letter-spacing:.04em; text-transform:uppercase; }
  main{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:16px; min-height:0; }
  .col{ display:flex; flex-direction:column; min-height:0; gap:16px; }
  .preview{ position:relative; border-radius:14px; overflow:hidden; background:#1a1a1a; border:1px solid #ffffff1f; aspect-ratio:16/9; }
  .preview .cv{ width:1920px; height:1080px; transform-origin:0 0; position:absolute; top:0; left:0; pointer-events:none; }
  .preview .cv > section{ height:1080px !important; }
  .notes{
    flex:1; min-height:0; overflow-y:auto; background:#171717; border:1px solid #ffffff14;
    border-radius:14px; padding:22px 24px; font-size:22px; line-height:1.5; color:#E7E7E3;
  }
  .notes em{ color:#8F8F8A; font-style:normal; font-size:15px; }
  .notes .lecture{ margin-top:18px; padding-top:14px; border-top:1px solid #ffffff14; font-size:17px; color:#B5B5B0; line-height:1.5; }
  .slide-name{ font-size:15px; color:#B5B5B0; margin-top:8px; }
  footer{ display:flex; gap:8px; align-items:center; }
  button{
    font:inherit; font-size:14px; cursor:pointer; color:#B5B5B0; background:#ffffff10;
    border:1px solid #ffffff1f; border-radius:100px; padding:10px 18px;
  }
  button:hover{ background:#ffffff1f; color:#FAFAF9; }
  button.primary{ background:#EDF725; color:#101010; border-color:#EDF725; font-weight:500; }
  .spacer{ flex:1; }
  .off{ color:#8F8F8A; font-size:13px; }
  @media (max-width:820px){ main{ grid-template-columns:1fr; } }
</style>
</head>
<body>
  <header>
    <div>
      <div class="label">Poznámky řečníka</div>
      <div class="slide-name" id="name">—</div>
    </div>
    <div class="count"><b id="n">1</b> / <span id="total">69</span></div>
    <div class="clock" id="clock">00:00<small>od začátku</small></div>
  </header>

  <main>
    <div class="col">
      <div>
        <div class="label">Teď</div>
        <div class="preview" id="p-cur"><div class="cv" id="cv-cur"></div></div>
      </div>
      <div class="notes" id="notes">Čekám na spojení s prezentací…</div>
    </div>
    <div class="col">
      <div>
        <div class="label">Další</div>
        <div class="preview" id="p-next"><div class="cv" id="cv-next"></div></div>
      </div>
      <div class="notes" id="notes-next" style="font-size:16px;color:#8F8F8A;"></div>
    </div>
  </main>

  <footer>
    <button id="prev">← Zpět</button>
    <button id="next" class="primary">Další →</button>
    <button id="reset">Vynulovat čas</button>
    <div class="spacer"></div>
    <div class="off" id="status">spojeno</div>
  </footer>

<script>
(function(){
  // Slidy nejsou v samostatném souboru (obsah je zamčený heslem) — pošle je
  // hlavní okno prezentace přes BroadcastChannel jako odpověď na „hello“.
  var S = [];
  var bc = new BroadcastChannel('mappa-deck');
  var n = 1, started = Date.now(), offset = 0;
  var $ = function(s){ return document.querySelector(s); };
  function paint(idx, el){
    var s = S[idx-1];
    el.innerHTML = s ? s.html : '';
    fit();
  }
  function fit(){
    ['#p-cur','#p-next'].forEach(function(sel){
      var box = $(sel), cv = box.querySelector('.cv');
      cv.style.transform = 'scale(' + (box.clientWidth/1920) + ')';
    });
  }
  function render(){
    var s = S[n-1];
    if(!s) return;
    $('#n').textContent = n;
    $('#name').textContent = s.label;
    $('#notes').innerHTML = (s.notes ? s.notes : '<em>Bez poznámky.</em>')
      + (s.lecture ? '<div class="lecture"><em>Ze školení:</em> ' + s.lecture.replace(/\n\n/g, '<br><br>') + '</div>' : '');
    var nx = S[n];
    $('#notes-next').textContent = nx ? (nx.label + (nx.notes ? ' — ' + nx.notes : '')) : 'Konec prezentace.';
    paint(n, $('#cv-cur'));
    if(nx) paint(n+1, $('#cv-next')); else $('#cv-next').innerHTML='';
  }

  bc.onmessage = function(e){
    var m = e.data||{};
    if(m.type==='slides' && m.slides){ S = m.slides; $('#total').textContent = S.length; render(); return; }
    if(m.type==='state'){
      n = m.n;
      if(m.started && !offset) started = m.started;
      $('#status').textContent = 'spojeno';
      render();
    }
  };
  bc.postMessage({type:'hello'});
  $('#status').textContent = 'čekám na prezentaci…';

  $('#next').onclick = function(){ bc.postMessage({type:'nav', delta:1}); };
  $('#prev').onclick = function(){ bc.postMessage({type:'nav', delta:-1}); };
  $('#reset').onclick = function(){ started = Date.now(); offset = 1; };

  document.addEventListener('keydown', function(e){
    if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].indexOf(e.key)>-1){ e.preventDefault(); bc.postMessage({type:'nav', delta:1}); }
    if(['ArrowLeft','PageUp','Backspace','ArrowUp'].indexOf(e.key)>-1){ e.preventDefault(); bc.postMessage({type:'nav', delta:-1}); }
  });

  setInterval(function(){
    var t = Math.floor((Date.now()-started)/1000);
    var mm = String(Math.floor(t/60)).padStart(2,'0'), ss = String(t%60).padStart(2,'0');
    $('#clock').innerHTML = mm+':'+ss+'<small>od začátku</small>';
  }, 500);

  window.addEventListener('resize', fit);
  render();
})();
</script>
</body>
</html>
